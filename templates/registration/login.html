<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | AutoShop Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-white">
    <div class="flex min-h-screen items-center justify-center px-4 py-12">
        <div class="w-full max-w-md rounded-3xl border border-white/10 bg-white/5 p-8 shadow-2xl backdrop-blur">
            <div class="mb-8">
                <div class="text-xs uppercase tracking-[0.3em] text-slate-400">AutoShop Pro</div>
                <h1 class="mt-2 text-3xl font-semibold">Manager Sign In</h1>
                <p class="mt-2 text-sm text-slate-300">Use your username and password to access the shop dashboard.</p>
            </div>
            <form method="post" class="space-y-5">
                {% csrf_token %}
                {% if form.non_field_errors %}
                    <div class="rounded-2xl border border-red-400/30 bg-red-400/10 px-4 py-3 text-sm text-red-100">
                        {{ form.non_field_errors }}
                    </div>
                {% endif %}
                {% for field in form %}
                    <div>
                        <label class="mb-2 block text-sm font-medium text-slate-200" for="{{ field.id_for_label }}">{{ field.label }}</label>
                        {{ field }}
                        {% if field.errors %}
                            <p class="mt-2 text-sm text-red-300">{{ field.errors|striptags }}</p>
                        {% endif %}
                    </div>
                {% endfor %}
                <button class="w-full rounded-2xl bg-blue-500 px-4 py-3 font-semibold text-white transition hover:bg-blue-400">Sign in</button>
            </form>
        </div>
    </div>
</body>
</html>
